<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <style>
  .blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
  .sway{transform-box:view-box;transform-origin:100px 176px;animation:sway 3.4s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
  .bobu{animation:bobu 2.6s ease-in-out infinite}
  @keyframes bobu{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .spin{transform-box:view-box;transform-origin:100px 100px;animation:spin 20s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .nod{transform-box:view-box;transform-origin:150px 126px;animation:nod 2.8s ease-in-out infinite}
  @keyframes nod{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
    <g class="spin"><polygon points="178.0,100.0 153.2,90.9 153.2,109.1" fill="#ffb300"/><polygon points="167.5,139.0 150.7,118.7 141.5,134.5" fill="#ffb300"/><polygon points="139.0,167.5 134.5,141.5 118.7,150.7" fill="#ffb300"/><polygon points="100.0,178.0 109.1,153.2 90.9,153.2" fill="#ffb300"/><polygon points="61.0,167.5 81.3,150.7 65.5,141.5" fill="#ffb300"/><polygon points="32.5,139.0 58.5,134.5 49.3,118.7" fill="#ffb300"/><polygon points="22.0,100.0 46.8,109.1 46.8,90.9" fill="#ffb300"/><polygon points="32.5,61.0 49.3,81.3 58.5,65.5" fill="#ffb300"/><polygon points="61.0,32.5 65.5,58.5 81.3,49.3" fill="#ffb300"/><polygon points="100.0,22.0 90.9,46.8 109.1,46.8" fill="#ffb300"/><polygon points="139.0,32.5 118.7,49.3 134.5,58.5" fill="#ffb300"/><polygon points="167.5,61.0 141.5,65.5 150.7,81.3" fill="#ffb300"/></g>
