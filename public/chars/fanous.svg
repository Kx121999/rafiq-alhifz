<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <style>
  .blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
  .swing{transform-box:view-box;transform-origin:100px 14px;animation:swing 3.2s ease-in-out infinite}
  @keyframes swing{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
  .glow{transform-box:fill-box;transform-origin:center;animation:glow 2.2s ease-in-out infinite}
  @keyframes glow{0%,100%{opacity:.75}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
