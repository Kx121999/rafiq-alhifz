<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <style>
  .blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
  .sway{transform-box:view-box;transform-origin:100px 176px;animation:sway 3.4s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
  .bobu{animation:bobu 2.6s ease-in-out infinite}
  @keyframes bobu{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .spin{transform-box:view-box;transform-origin:100px 100px;animation:spin 20s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .nod{transform-box:view-box;transform-origin:150px 126px;animation:nod 2.8s ease-in-out infinite}
  @keyframes nod{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
  <ellipse cx="100" cy="182" rx="56" ry="8" fill="#000" opacity=".12"/>
  <g class="bobu"><g fill="#bcd9f5" stroke="#bcd9f5" stroke-width="9"><circle cx="66" cy="112" r="30"/><circle cx="102" cy="90" r="40"/><circle cx="142" cy="110" r="30"/><rect x="40" y="108" width="132" height="40" rx="20"/></g><g fill="#ffffff"><circle cx="66" cy="112" r="30"/><circle cx="102" cy="90" r="40"/><circle cx="142" cy="110" r="30"/><rect x="40" y="108" width="132" height="40" rx="20"/></g>
  <g class="blink"><ellipse cx="84" cy="112" rx="6" ry="8" fill="#1b2e44"/><ellipse cx="118" cy="112" rx="6" ry="8" fill="#1b2e44"/><circle cx="86" cy="109" r="2.3" fill="#fff"/><circle cx="120" cy="109" r="2.3" fill="#fff"/></g><circle cx="70" cy="126" r="7" fill="#ff8f70" opacity=".55"/><circle cx="132" cy="126" r="7" fill="#ff8f70" opacity=".55"/><path d="M90 128c4 9 18 9 22 0" stroke="#1b2e44" stroke-width="4" stroke-linecap="round"/></g>
</svg>
