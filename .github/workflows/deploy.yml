name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # a failing test stops the deploy
      - run: npm test
      # build runs the data check (114 surahs, 6236 ayat) before bundling
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # axe-core on every page and key state, light and dark, plus a 320px reflow check
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run a11y
      # real-browser journeys: first visit, memorise, adhkar, shop, backup round trip, old data, no storage
      - run: npm run e2e

  deploy:
    needs: [build, a11y]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
